<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EduExam Pro - Hệ Thống Khảo Thí & Thi Online GDPT 2018</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://unpkg.com/mathlive"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="./eduexam-math-widget.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #1e293b; }
    .exam-paper { font-family: 'Times New Roman', Times, serif; }
    .hidden { display: none !important; }
    .sidebar-scroll { max-height: calc(100vh - 170px); overflow-y: auto; }
    math-field {
      display: block; width: 100%; min-height: 120px; padding: 10px 14px;
      font-size: 18px; background: #fff; border: 1.5px solid #94a3b8; border-radius: 6px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col antialiased">

  <header class="bg-indigo-700 text-white px-4 py-3 md:px-6 flex flex-wrap items-center justify-between shadow-md gap-3 sticky top-0 z-50">
    <div class="flex items-center gap-2.5">
      <div class="bg-white text-indigo-700 p-2 rounded-lg font-bold text-base shadow-sm">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <div>
        <h1 class="font-bold text-base md:text-lg leading-tight">EduExam Pro</h1>
        <p class="text-[11px] md:text-xs text-indigo-200">Khảo thí GDPT 2018 đa cấp học</p>
      </div>
    </div>
    
    <div class="flex flex-wrap items-center gap-2">
      <button onclick="downloadWordDocxPython()" class="bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs px-3 py-2.5 rounded shadow flex items-center gap-1.5 cursor-pointer border border-slate-600">
        <i class="fa-solid fa-file-export text-amber-400"></i> <span>Tải .docx</span>
      </button>
    </div>
  </header>

  <div class="flex flex-col md:flex-row flex-1 overflow-x-hidden">
    <aside id="configSidebar" class="w-full md:w-84 lg:w-96 bg-white border-r border-slate-200 p-4 flex flex-col gap-3 shrink-0 shadow-sm">
      <div class="space-y-2.5 text-xs sidebar-scroll pr-1">
        <div class="bg-indigo-50 p-2.5 rounded-lg border border-indigo-200 space-y-1.5">
          <label class="block font-bold text-indigo-950">Cấp học mục tiêu</label>
          <div class="grid grid-cols-3 gap-1.5 text-center font-bold">
            <button type="button" onclick="selectLevel('tieuhoc')" id="btnLvlTieuhoc" class="py-1.5 px-2 rounded border bg-white">Tiểu học</button>
            <button type="button" onclick="selectLevel('thcs')" id="btnLvlThcs" class="py-1.5 px-2 rounded border bg-indigo-600 text-white">THCS</button>
            <button type="button" onclick="selectLevel('thpt')" id="btnLvlThpt" class="py-1.5 px-2 rounded border bg-white">THPT</button>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div class="col-span-2">
            <label class="block font-semibold mb-0.5">Môn học</label>
            <select id="subject" class="w-full border rounded p-2 bg-slate-50 text-xs font-medium"></select>
          </div>
          <div>
            <label class="block font-semibold mb-0.5">Khối</label>
            <select id="grade" class="w-full border rounded p-2 bg-slate-50 text-xs font-medium"></select>
          </div>
        </div>
      </div>

      <div class="pt-1 mt-auto">
        <button onclick="triggerGenerate()" id="btnGenerate" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-md shadow transition flex items-center justify-center gap-2 text-sm cursor-pointer">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          <span>AI Tổng Hợp & Sinh Đề</span>
        </button>
      </div>
    </aside>

    <main class="flex-1 bg-slate-200/80 p-3 sm:p-6 flex flex-col items-center">
      <div id="examContainer" class="bg-white w-full max-w-4xl p-5 sm:p-10 shadow-lg rounded exam-paper text-[14px] leading-relaxed text-black border border-slate-300">
        
        <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px; border-bottom: 2px solid black; padding-bottom: 10px;">
          <tr>
            <td style="width: 45%; vertical-align: top; text-align: center; border: none;">
              <p style="font-weight: bold; font-size: 13px; text-transform: uppercase;" id="previewSchool">TRƯỜNG THCS LÊ QUÝ ĐÔN</p>
            </td>
            <td style="width: 55%; vertical-align: top; text-align: center; border: none;">
              <p style="font-weight: bold; font-size: 13.5px; text-transform: uppercase;" id="previewTitle">ĐỀ KIỂM TRA ĐỊNH KỲ</p>
              <div id="previewCode" style="margin-top: 4px; display: inline-block; border: 1px solid black; padding: 2px 10px; font-weight: bold; font-size: 12px;">MÃ ĐỀ: 101</div>
            </td>
          </tr>
        </table>

        <div id="examBody" class="space-y-6">
          <div>
            <div id="p1Heading" class="font-bold text-sm sm:text-[15px] mb-1">PHẦN I. TRẮC NGHIỆM</div>
            <div class="space-y-4 text-xs sm:text-sm" id="part1Container">
              <p class="text-slate-400 italic">Nhấn "AI Tổng Hợp & Sinh Đề" để tạo câu hỏi...</p>
            </div>
          </div>

          <div>
            <div id="p3Heading" class="font-bold text-sm sm:text-[15px] mb-1">PHẦN III. TỰ LUẬN</div>
            <div class="space-y-4 text-xs sm:text-sm" id="part3Container"></div>
          </div>
        </div>

        <div id="teacherSolutionsArea" class="mt-8 pt-6 border-t-2 border-dashed border-slate-300">
          <h3 class="text-center font-bold text-xs sm:text-sm mb-3 uppercase">BẢNG ĐÁP ÁN & MA TRẬN 4 MÃ ĐỀ</h3>
          <div class="overflow-x-auto w-full">
            <table class="w-full text-xs text-center border-collapse border border-slate-400 min-w-[300px]">
              <thead>
                <tr class="bg-indigo-900 text-white font-bold">
                  <th class="border p-1.5">Câu hỏi</th>
                  <th class="border p-1.5">Mã 101</th>
                  <th class="border p-1.5">Mã 102</th>
                  <th class="border p-1.5">Mã 103</th>
                  <th class="border p-1.5">Mã 104</th>
                </tr>
              </thead>
              <tbody id="matrixTableBody">
                <tr><td colspan="5" class="border p-2 text-slate-400 italic">Chưa có dữ liệu ma trận</td></tr>
              </tbody>
            </table>
          </div>
          <div id="answerKeySection" class="mt-8 pt-6 border-t-2 border-indigo-200 space-y-4"></div>
        </div>

      </div>
    </main>
  </div>

  <script>
    const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? 'http://localhost:8000'
      : 'https://eduexam-backend.onrender.com';

    let currentExamData = null;
    let currentLevel = 'thcs';

    function cleanLatexMath(raw) {
      if (!raw) return '';
      let str = String(raw).normalize('NFC');
      str = str.replace(/\\newline/g, '<br/>');
      str = str.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      str = str.replace(/\r\n|\r|\n/g, '<br/>');

      if (str.includes('$')) {
        str = str.replace(/\$([^$]+)\$/g, (match, formula) => {
          try {
            return katex.renderToString(formula.trim(), { throwOnError: false, displayMode: false });
          } catch (e) {
            return formula;
          }
        });
      }
      return str;
    }

    function formatTextWithTikz(text) {
      if (!text) return '';
      let cleanText = cleanLatexMath(text);
      const tikzRegex = /(\\begin\{tikzpicture\}[\s\S]*?\\end\{tikzpicture\})/g;
      
      if (tikzRegex.test(cleanText)) {
        cleanText = cleanText.replace(tikzRegex, (match) => {
          const containerId = 'tikz_inline_' + Math.random().toString(36).substring(2, 9);
          setTimeout(() => {
            fetch('https://kroki.io/tikz/svg', {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain; charset=utf-8' },
              body: match
            })
            .then(res => res.ok ? res.text() : Promise.reject())
            .then(svg => {
              const el = document.getElementById(containerId);
              if (el) el.innerHTML = svg;
            })
            .catch(() => {
              const el = document.getElementById(containerId);
              if (el) el.innerHTML = `<span class="text-xs text-rose-500">[Lỗi render hình TikZ]</span>`;
            });
          }, 50);
          return `<div id="${containerId}" class="my-2 flex justify-center items-center overflow-x-auto"><span class="text-xs text-slate-400"><i class="fa-solid fa-spinner fa-spin"></i> Đang dựng hình...</span></div>`;
        });
      }
      return cleanText;
    }

    function formatTikzHtml(imageSource) {
      if (!imageSource || typeof imageSource !== 'string') return '';
      const val = imageSource.trim();
      if (!val || val === "null" || val === "None" || val.length < 5) return '';

      if (val.startsWith('http://') || val.startsWith('https://') || val.startsWith('data:image/')) {
        return `
          <div class="my-3 p-3 bg-white rounded-lg border border-indigo-200 flex flex-col items-center justify-center shadow-sm max-w-lg mx-auto">
            <img src="${val}" alt="Hình minh họa" class="max-w-full h-auto object-contain bg-white p-1 rounded" style="max-height: 280px;" />
          </div>
        `;
      }
      return formatTextWithTikz(val);
    }

    const LEVEL_CONFIGS = {
      tieuhoc: { grades: [1, 2, 3, 4, 5], subjects: ["Toán học", "Tiếng Việt"] },
      thcs: { grades: [6, 7, 8, 9], subjects: ["Toán học", "Khoa học tự nhiên", "Ngữ văn", "Tiếng Anh"] },
      thpt: { grades: [10, 11, 12], subjects: ["Toán học", "Vật lí", "Hóa học", "Tiếng Anh"] }
    };

    function selectLevel(lvl) {
      currentLevel = lvl;
      ['tieuhoc', 'thcs', 'thpt'].forEach(l => {
        const btn = document.getElementById(`btnLvl${l.charAt(0).toUpperCase() + l.slice(1)}`);
        if (l === lvl) {
          btn.className = "py-1.5 px-2 rounded border border-indigo-600 bg-indigo-600 text-white shadow transition cursor-pointer";
        } else {
          btn.className = "py-1.5 px-2 rounded border border-slate-300 bg-white hover:bg-indigo-100 text-slate-700 transition cursor-pointer";
        }
      });
      loadLevelOptions();
    }

    function loadLevelOptions() {
      const cfg = LEVEL_CONFIGS[currentLevel];
      document.getElementById('grade').innerHTML = cfg.grades.map(g => `<option value="${g}">Lớp ${g}</option>`).join('');
      document.getElementById('subject').innerHTML = cfg.subjects.map(s => `<option value="${s}">${s}</option>`).join('');
    }

    async function triggerGenerate() {
      const btn = document.getElementById('btnGenerate');
      const subject = document.getElementById('subject').value;
      const grade = parseInt(document.getElementById('grade').value) || 7;

      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>Đang sinh đề...</span>`;
      btn.disabled = true;

      try {
        const response = await fetch(`${API_BASE_URL}/api/exams/generate-full`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            level: currentLevel,
            subject: subject,
            grade: grade,
            topic: "Ôn tập tổng hợp",
            duration_minutes: 45
          })
        });

        if (!response.ok) throw new Error("Lỗi kết nối server");

        const result = await response.json();
        const examObj = result.base_exam || result;
        const matrixObj = result.answer_matrix || {};
        
        currentExamData = { base_exam: examObj, answer_matrix: matrixObj };
        renderExamToView(examObj, matrixObj);
      } catch (err) {
        alert('Lỗi: ' + err.message);
      } finally {
        btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> <span>AI Tổng Hợp & Sinh Đề</span>`;
        btn.disabled = false;
      }
    }

    function renderExamToView(exam, matrix) {
      if (!exam) return;

      const p1List = exam.part_1_mcq || [];
      const part1Container = document.getElementById('part1Container');
      if (part1Container) {
        part1Container.innerHTML = p1List.map((q, idx) => {
          const qText = formatTextWithTikz(q.content || '');
          let optsDict = { 'A': '', 'B': '', 'C': '', 'D': '' };
          if (Array.isArray(q.options)) {
            q.options.forEach((o, i) => {
              const label = ['A', 'B', 'C', 'D'][i] || 'A';
              optsDict[label] = formatTextWithTikz(typeof o === 'object' ? (o.text || o.content) : String(o));
            });
          }
          return `
            <div class="space-y-1.5 p-2 rounded bg-slate-50/50">
              <p><strong>Câu ${idx + 1}:</strong> ${qText}</p>
              ${formatTikzHtml(q.image_url || q.tikz_code)}
              <table style="width: 100%; border-collapse: collapse; border: none; margin-top: 4px;">
                <tr>
                  <td style="width: 25%; border: none;"><strong>A.</strong> ${optsDict['A']}</td>
                  <td style="width: 25%; border: none;"><strong>B.</strong> ${optsDict['B']}</td>
                  <td style="width: 25%; border: none;"><strong>C.</strong> ${optsDict['C']}</td>
                  <td style="width: 25%; border: none;"><strong>D.</strong> ${optsDict['D']}</td>
                </tr>
              </table>
            </div>
          `;
        }).join('');
      }

      // Ma trận 4 mã đề đầy đủ
      if (matrix && Object.keys(matrix).length > 0) {
        const tbody = document.getElementById('matrixTableBody');
        if (tbody) {
          const codes = ['101', '102', '103', '104'];
          const sampleCode = codes.find(c => matrix[c]) || '101';
          const qKeys = Object.keys(matrix[sampleCode] || {});
          
          let html = '';
          qKeys.forEach((qk, idx) => {
            html += `
              <tr class="${idx % 2 === 1 ? 'bg-slate-50' : ''}">
                <td class="border p-1 font-bold">${qk}</td>
                <td class="border font-semibold">${matrix['101']?.[qk] || '-'}</td>
                <td class="border font-semibold">${matrix['102']?.[qk] || '-'}</td>
                <td class="border font-semibold">${matrix['103']?.[qk] || '-'}</td>
                <td class="border font-semibold">${matrix['104']?.[qk] || '-'}</td>
              </tr>
            `;
          });
          tbody.innerHTML = html;
        }
      }
    }

    async function downloadWordDocxPython() {
      if (!currentExamData) {
        alert('Vui lòng tạo đề trước!');
        return;
      }
      try {
        const response = await fetch(`${API_BASE_URL}/api/exams/export-word`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            base_exam: currentExamData.base_exam,
            answer_matrix: currentExamData.answer_matrix,
            level: currentLevel
          })
        });
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `De_Thi_${currentLevel.toUpperCase()}.docx`;
        a.click();
      } catch (err) {
        alert('Lỗi tải file: ' + err.message);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      selectLevel('thcs');
    });
  </script>
</body>
</html>
