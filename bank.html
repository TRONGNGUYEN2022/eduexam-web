<!DOCTYPE html>
<html lang="vi">
<head>

  <title>EduExam Studio - Quản Trị Kho Học Liệu GDPT 2018</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

        <i class="fa-solid fa-cloud-arrow-down text-indigo-400"></i> <span class="hidden md:inline">Khôi Phục GDrive</span>
      </button>

      <a href="index.html" class="bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-bold text-xs px-3.5 py-1.5 rounded-lg shadow-md flex items-center gap-2 transition cursor-pointer border border-indigo-400/40">
        <i class="fa-solid fa-file-circle-check text-amber-300"></i>

  <script>
    const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? 'http://localhost:8000'
      : 'https://eduexam-backend.onrender.com';

    let currentInputMode = 'auto';
    let currentDraftQuestions = [];
    let currentBankQuestions = [];

    function renderMath(text) {
      if (!text) return '';
      let s = String(text).replace(/!\[.*?\](?:\(.*?\))?/g, '').replace(/\$\$\s*([\s\S]*?)\s*\$\$/g, '$$$1$$').replace(/\\text\s*\{([^}]*)\}/g, '$1').replace(/\\text\s+/g, ' ').replace(/\\times/g, '×');
      s = s.replace(/\$([^\$\r\n]+?)\$/g, (m, f) => {
        try { return katex.renderToString(f.trim(), { throwOnError: false, displayMode: false }); } catch (e) { return f; }
      });
      return s;
    }

    function cleanQuestionContent(content) {
      if (!content) return '';
      let s = String(content);
      s = s.replace(/\s*(?:Trang\s*\d+\/\d+|Mã\s*đề(?:\s*thi)?\s*[\d\w]+|\*\*PHẦN\s*[I|V|X]+[\s\S]*).*$/i, '');
      s = s.replace(/\s*(?:[A-D]\.|\b[A-D]\s*[\.,:])\s*[\s\S]*$/, '');
      return s.trim();
    }

    function parseMarkdownTables(text) {
      if (!text || !text.includes('|')) return renderMath(text);
      const lines = text.split('\n');
      let inTable = false;
      let tableHtml = '<div class="overflow-x-auto my-3"><table class="table-math w-full border-collapse border border-slate-300 bg-white rounded-xl shadow-xs text-xs overflow-hidden">';
      let newLines = [];

      for (let line of lines) {
        const trimmed = line.trim();
        if (trimmed.startsWith('|') && trimmed.endsWith('|')) {
          if (trimmed.includes('---')) continue;
          const cells = trimmed.split('|').slice(1, -1);
          if (!inTable) { inTable = true; tableHtml += '<tbody>'; }
          tableHtml += '<tr class="border-b border-slate-200">' + cells.map(c => `<td class="text-left p-2.5 pl-3 leading-relaxed">${renderMath(c.trim())}</td>`).join('') + '</tr>';
        } else {
          if (inTable) {
            tableHtml += '</tbody></table></div>';
            newLines.push(tableHtml);
            tableHtml = '<div class="overflow-x-auto my-3"><table class="table-math w-full border-collapse border border-slate-300 bg-white rounded-xl shadow-xs text-xs overflow-hidden">';
            inTable = false;
          }
          if (trimmed) newLines.push(renderMath(trimmed));
        }
      }
      if (inTable) { tableHtml += '</tbody></table></div>'; newLines.push(tableHtml); }
      return newLines.join('<br/>');
    }

    function cleanLatexMath(raw) {
      if (!raw) return '';
      return parseMarkdownTables(String(raw));
    }

    function getOptionsGridClass(options) {
      if (!options || options.length === 0) return '';
      const rawList = options.map(o => String(o));
      const maxLen = Math.max(...rawList.map(t => t.length), 0);
      const hasComplex = rawList.some(t => /\\(frac|int|sqrt|sum|prod)/.test(t));
      if (hasComplex || maxLen > 45) return 'grid grid-cols-1';
      if (maxLen > 20) return 'grid grid-cols-1 sm:grid-cols-2';
      return 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4';
    }

    function renderCognitivePicker(idx, currentM, scope) {
      const levels = [
        { code: 'M1', label: 'M1', color: 'text-blue-700' },
        { code: 'M2', label: 'M2', color: 'text-emerald-700' },
        { code: 'M3', label: 'M3', color: 'text-amber-700' },
        { code: 'M4', label: 'M4', color: 'text-rose-700' }
      ];
      return `
        <div class="inline-flex items-center gap-1.5 bg-slate-100 px-2 py-0.5 rounded-lg border border-slate-200 text-[11px] font-bold">
          ${levels.map(lvl => `
            <label class="inline-flex items-center gap-0.5 cursor-pointer hover:opacity-80">
              <input type="radio" name="cog_${scope}_${idx}" value="${lvl.code}" 
                     ${currentM === lvl.code ? 'checked' : ''} 
                     onchange="changeQuestionCognitive('${scope}', ${idx}, '${lvl.code}')" 
                     class="w-3 h-3 accent-indigo-600 cursor-pointer">
              <span class="${lvl.color}">${lvl.label}</span>
            </label>
          `).join('')}
        </div>
      `;
    }

    async function changeQuestionCognitive(scope, idx, newM) {
      if (scope === 'draft') {
        if (currentDraftQuestions[idx]) currentDraftQuestions[idx].cognitive_level = newM;
      } else if (scope === 'bank') {
        const q = currentBankQuestions[idx];
        if (q) {
          q.cognitive_level = newM;
          try {
            await fetch(`${API_BASE_URL}/api/questions/${q.id}`, {
              method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(q)
            });
          } catch (e) {}
        }
      }
    }

    function getQuestionTypeBadge(t) {
      if (t === 'single_choice') return `<span class="text-[11px] font-bold px-2 py-0.5 rounded-lg bg-purple-50 text-purple-700 border border-purple-200">Trắc nghiệm</span>`;
      if (t === 'true_false') return `<span class="text-[11px] font-bold px-2 py-0.5 rounded-lg bg-indigo-50 text-indigo-700 border border-indigo-200">Đúng / Sai</span>`;
      return `<span class="text-[11px] font-bold px-2 py-0.5 rounded-lg bg-slate-100 text-slate-700 border border-slate-200">Tự luận</span>`;
    }

    function switchInputMode(mode) {
      currentInputMode = mode;
      const isAuto = mode === 'auto';
      document.getElementById('modeBtnAuto').className = isAuto ? "py-2 rounded-lg bg-indigo-600 text-white shadow transition cursor-pointer" : "py-2 rounded-lg text-slate-400 hover:text-white transition cursor-pointer";
      document.getElementById('modeBtnManual').className = !isAuto ? "py-2 rounded-lg bg-indigo-600 text-white shadow transition cursor-pointer" : "py-2 rounded-lg text-slate-400 hover:text-white transition cursor-pointer";
      document.getElementById('autoModeSection').classList.toggle('hidden', !isAuto);
      document.getElementById('manualModeSection').classList.toggle('hidden', isAuto);
    }

    async function startParseExamFile() {
      const fileInput = document.getElementById('examFileInput');
      if (!fileInput.files || fileInput.files.length === 0) { alert("Vui lòng chọn file .zip!"); return; }
      const btn = document.getElementById('btnStartParse');
      const statusText = document.getElementById('parseStatusText');
      const formData = new FormData();
      formData.append('file', fileInput.files[0]);
      formData.append('level_stage', document.getElementById('autoStageSelect').value);
      formData.append('grade', document.getElementById('autoGradeSelect').value);
      formData.append('subject', document.getElementById('autoSubjectSelect').value);
      formData.append('topic', document.getElementById('autoTopicInput').value.trim() || "Chung");
      formData.append('auto_save', "false");

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>Đang xử lý...</span>`;
      statusText.innerText = "Đang trích xuất dữ liệu học liệu...";

      try {
        const res = await fetch(`${API_BASE_URL}/api/upload-mistral-zip`, { method: 'POST', body: formData });
        const data = await res.json();
        currentDraftQuestions = data.questions || [];
        statusText.innerText = `Bóc tách thành công ${currentDraftQuestions.length} câu hỏi!`;
        renderDraftView();
        switchView('draft');
      } catch (err) {
        statusText.innerText = "Lỗi: " + err.message;
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-bolt text-amber-300"></i> <span>Bóc Tách &amp; Xem Bản Nháp</span>`;
      }
    }

    function renderDraftView() {
      document.getElementById('draftCountBadge').innerText = currentDraftQuestions.length;
      const container = document.getElementById('draftContainer');

      if (currentDraftQuestions.length === 0) {
        container.innerHTML = `<div class="bg-slate-900/60 p-12 rounded-2xl border border-dashed border-slate-800 text-center text-slate-500 italic text-sm">Chưa có tài liệu nháp.</div>`;
        return;
      }

      const filterLesson = document.getElementById('draftFilterLesson')?.value.trim().toLowerCase() || "";
      const filterCog = document.getElementById('draftFilterCognitive')?.value || "";
      const filterType = document.getElementById('draftFilterType')?.value || "";

      const filteredDrafts = currentDraftQuestions.map((q, idx) => ({ ...q, originalIndex: idx })).filter(q => {
        if (filterCog && q.cognitive_level !== filterCog) return false;
        if (filterType && q.q_type !== filterType) return false;
        if (filterLesson) {
          const lessonStr = (q.lesson || "").toLowerCase();
          const topicStr = (q.topic || "").toLowerCase();
          const contentStr = (q.content || "").toLowerCase();
          if (!lessonStr.includes(filterLesson) && !topicStr.includes(filterLesson) && !contentStr.includes(filterLesson)) {
            return false;
          }
        }
        return true;
      });

      if (filteredDrafts.length === 0) {
        container.innerHTML = `<div class="bg-white p-8 rounded-2xl border border-slate-200 text-center text-slate-400 italic text-sm">Không tìm thấy câu hỏi phù hợp.</div>`;
        return;
      }

      container.innerHTML = filteredDrafts.map((q) => {
        const idx = q.originalIndex;
        return `
          <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
            <div class="flex items-center justify-between gap-2">
              <div class="flex flex-wrap items-center gap-2">
                <input type="checkbox" name="draftCheckbox" value="${idx}" checked class="w-4 h-4 accent-indigo-600 cursor-pointer">
                <span class="font-bold text-sm text-indigo-950">Câu ${idx + 1}</span>
                ${getQuestionTypeBadge(q.q_type)}
                <span class="text-[11px] bg-slate-100 text-slate-700 px-2 py-0.5 rounded-md font-bold">Lớp ${q.grade || 12}</span>
                <span class="text-[11px] bg-indigo-50 text-indigo-900 border border-indigo-200 px-2 py-0.5 rounded-md font-semibold">Bài: ${q.lesson || q.topic || 'Chung'}</span>
                <span class="text-[10px] text-slate-500 font-semibold ml-1">Mức độ:</span>
                ${renderCognitivePicker(idx, q.cognitive_level || 'M2', 'draft')}
              </div>
              <button onclick="removeDraftItem(${idx})" class="text-slate-400 hover:text-rose-600 text-xs font-bold px-2 py-1 cursor-pointer">✕</button>
            </div>

            <div class="text-[14.5px] font-medium text-slate-900 leading-relaxed pl-6">
              ${cleanLatexMath(cleanQuestionContent(q.content || ''))}
            </div>

            ${q.options && q.options.length > 0 ? `
              <div class="pl-6 ${getOptionsGridClass(q.options)} gap-2 text-xs">
                ${q.options.map((o, i) => {
                  const optLetter = ['A', 'B', 'C', 'D'][i];
                  const cleanOpt = String(o).replace(/^[A-D]\s*[\.,:]\s*/i, '');
                  return `<div class="bg-slate-50 p-2 rounded-lg border border-slate-200"><strong>${optLetter}.</strong> ${cleanLatexMath(cleanOpt)}</div>`;
                }).join('')}
              </div>` : ''}

            ${q.image_base64 ? `
              <div class="pl-6 my-2 text-center">
                <img src="${q.image_base64}" class="max-h-60 rounded-xl border p-1 bg-white shadow-sm inline-block" alt="Hình minh họa">
              </div>` : ''}

            ${q.explanation ? `
              <div class="text-xs bg-slate-50 p-4 rounded-xl border border-slate-200 text-slate-800 space-y-1 ml-6">
                <strong class="text-indigo-950 font-bold block mb-1 text-sm"><i class="fa-solid fa-file-lines text-indigo-600 mr-1.5"></i> Lời giải chi tiết / Barem:</strong>
                ${cleanLatexMath(q.explanation)}
              </div>` : ''}
          </div>
        `;
      }).join('');
    }

    function removeDraftItem(idx) {
      currentDraftQuestions.splice(idx, 1);
      renderDraftView();
    }
    function toggleSelectAllDraft(checked) {
      document.querySelectorAll('input[name="draftCheckbox"]').forEach(cb => cb.checked = checked);
    }

    async function saveApprovedDraftsToDb() {
      const checkedBoxes = document.querySelectorAll('input[name="draftCheckbox"]:checked');
      if (checkedBoxes.length === 0) { alert("Vui lòng chọn ít nhất 1 câu!"); return; }
      const selectedIndices = Array.from(checkedBoxes).map(cb => parseInt(cb.value));
      const questionsToSave = selectedIndices.map(idx => {
        const q = currentDraftQuestions[idx];
        return {
          level_stage: q.level_stage || "thpt", grade: q.grade || 12, subject: q.subject || "Toán học",
          topic: q.lesson || q.topic || "Chung", lesson: q.lesson || q.topic || "Chung", level: "Thông hiểu",
          cognitive_level: q.cognitive_level || "M2", q_type: q.q_type || "essay", content: q.content || "",
          options: q.options || [], correct_answer: "", explanation: q.explanation || "",
          has_image: q.image_base64 ? 1 : 0, image_base64: q.image_base64 || ""
        };
      });

      const res = await fetch(`${API_BASE_URL}/api/questions/bulk-save`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ questions: questionsToSave })
      });
      const data = await res.json();
      alert(`Đã lưu thành công ${data.count} câu vào kho Database!`);
      currentDraftQuestions = currentDraftQuestions.filter((_, i) => !selectedIndices.includes(i));
      renderDraftView();
      updateTotalBankCount();
      switchView('bank');
    }

    async function loadBankQuestions() {
      const grade = document.getElementById('filterGrade').value;
      const cog = document.getElementById('filterCognitive').value;
      const qType = document.getElementById('filterType').value;
      const lesson = document.getElementById('filterLesson')?.value.trim();
      const kw = document.getElementById('filterKeyword')?.value.trim();

      const params = new URLSearchParams();
      if (grade) params.append('grade', grade);
      if (cog) params.append('cognitive_level', cog);
      if (qType) params.append('q_type', qType);
      if (lesson) params.append('lesson', lesson);
      if (kw) params.append('keyword', kw);

      const res = await fetch(`${API_BASE_URL}/api/questions/filter?${params.toString()}`);
      const data = await res.json();
      currentBankQuestions = data.questions || [];
      document.getElementById('savedCountBadge').innerText = data.total || 0;

      const container = document.getElementById('bankContainer');
      if (currentBankQuestions.length === 0) {
        container.innerHTML = `<div class="bg-slate-900/60 p-12 rounded-2xl border border-dashed border-slate-800 text-center text-slate-500 italic text-sm">Không tìm thấy câu hỏi phù hợp.</div>`;
        return;
      }

      container.innerHTML = currentBankQuestions.map((r, i) => `
        <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-3">
          <div class="flex items-center justify-between gap-1">
            <div class="flex flex-wrap items-center gap-2">
              <span class="font-bold text-sm text-indigo-950">#ID ${r.id} | Lớp ${r.grade}</span>
              ${getQuestionTypeBadge(r.q_type)}
              <span class="text-[11px] bg-indigo-50 text-indigo-900 border border-indigo-200 px-2 py-0.5 rounded-md font-semibold">Bài: ${r.lesson || r.topic}</span>
              ${renderCognitivePicker(i, r.cognitive_level || 'M2', 'bank')}
            </div>
            <button onclick="deleteSavedQuestion(${r.id})" class="text-slate-400 hover:text-rose-600 font-bold px-2 py-1 cursor-pointer">✕</button>
          </div>

          <div class="text-[14.5px] font-medium text-slate-900 leading-relaxed">${cleanLatexMath(cleanQuestionContent(r.content))}</div>

          ${r.options && r.options.length > 0 ? `
            <div class="${getOptionsGridClass(r.options)} gap-2 text-xs">
              ${r.options.map((o, idx) => `<div class="bg-slate-50 p-2 rounded-lg border border-slate-200"><strong>${['A','B','C','D'][idx]}.</strong> ${cleanLatexMath(String(o).replace(/^[A-D]\s*[\.,:]\s*/i, ''))}</div>`).join('')}
            </div>` : ''}

          ${r.image_base64 ? `<div class="my-2 text-center"><img src="${r.image_base64}" class="max-h-52 rounded-xl border p-1 bg-white inline-block"></div>` : ''}

          ${r.explanation ? `
            <div class="text-xs bg-slate-50 p-4 rounded-xl border border-slate-200 text-slate-800 space-y-1">
              <strong class="text-indigo-950 font-bold block mb-1 text-sm"><i class="fa-solid fa-file-lines text-indigo-600 mr-1.5"></i> Lời giải chi tiết / Barem:</strong>
              ${cleanLatexMath(r.explanation)}
            </div>` : ''}
        </div>
      `).join('');
    }

    async function deleteSavedQuestion(id) {
      if (!confirm(`Xóa câu hỏi ID ${id}?`)) return;
      await fetch(`${API_BASE_URL}/api/questions/${id}`, { method: 'DELETE' });
      loadBankQuestions();
      updateTotalBankCount();
    }

    async function updateTotalBankCount() {
      const res = await fetch(`${API_BASE_URL}/api/questions/filter`);
      const data = await res.json();
      document.getElementById('bankCountBadge').innerText = `${data.total || 0} câu`;
      document.getElementById('savedCountBadge').innerText = data.total || 0;
    }

    function switchView(view) {
      const isDraft = view === 'draft';
      document.getElementById('tabBtnDraft').className = isDraft ? "px-3.5 py-2 text-xs font-bold rounded-xl bg-indigo-600 text-white shadow transition cursor-pointer" : "px-3.5 py-2 text-xs font-bold rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition cursor-pointer";
      document.getElementById('tabBtnBank').className = !isDraft ? "px-3.5 py-2 text-xs font-bold rounded-xl bg-indigo-600 text-white shadow transition cursor-pointer" : "px-3.5 py-2 text-xs font-bold rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition cursor-pointer";
      document.getElementById('draftSection').classList.toggle('hidden', !isDraft);
      document.getElementById('draftActionControls').classList.toggle('hidden', !isDraft);
      document.getElementById('bankSection').classList.toggle('hidden', isDraft);
      if (!isDraft) loadBankQuestions();
    }

    async function uploadDatabaseToGoogleDrive() {
      const btn = document.getElementById('btnBackupGDrive');
      const originalHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-emerald-400"></i> Đang sao lưu...`;
      try {
        const res = await fetch(`${API_BASE_URL}/api/drive/upload-db`, { method: 'POST' });
        const data = await res.json();
        alert(data.message);
      } catch (err) { alert("Lỗi: " + err.message); }
      finally { btn.disabled = false; btn.innerHTML = originalHtml; }
    }

    async function restoreDatabaseFromGoogleDrive() {
      if (!confirm("Khôi phục DB từ Google Drive? Dữ liệu hiện tại sẽ bị ghi đè.")) return;
      const btn = document.getElementById('btnRestoreGDrive');
      const originalHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-indigo-400"></i> Đang khôi phục...`;
      try {
        const res = await fetch(`${API_BASE_URL}/api/drive/restore-db`, { method: 'POST' });
        const data = await res.json();
        alert(data.message);
        loadBankQuestions();
        updateTotalBankCount();
      } catch (err) { alert("Lỗi: " + err.message); }
      finally { btn.disabled = false; btn.innerHTML = originalHtml; }
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateTotalBankCount();
    });
  </script>
</body>
</html>
